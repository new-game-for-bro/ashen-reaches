name: Private Android APK
on:
  push:
    branches: [main, feature/corinth-environment]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: false
      - name: Fetch game models
        run: |
          git lfs pull --include="models/environment/*.glb"
          git config --local --unset-all http.https://github.com/.extraheader || true
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and Android template
        run: |
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fsSL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          unzip -q /tmp/templates.tpz 'templates/android_debug.apk' -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp /tmp/godot-templates/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Configure Android debug signing
        run: |
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "/tmp/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.tres"
      - name: Import and export APK
        run: |
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --editor --path . --import
          timeout 120 "$GODOT" --headless --path . --script res://tests/model_probe.gd
          timeout 90 "$GODOT" --headless --path . --script res://tests/mobile_controls_smoke.gd
          timeout 90 "$GODOT" --headless --path . --script res://tests/mobile_layout_smoke.gd
          timeout 90 "$GODOT" --headless --path . --script res://tests/net_intents_test.gd
          timeout 90 "$GODOT" --headless --path . --script res://tests/join_code_test.gd
          timeout 90 "$GODOT" --headless --path . --script res://tests/match_state_test.gd
          timeout 90 "$GODOT" --headless --path . --script res://tests/match_ticket_test.gd
          mkdir -p /tmp/ashen-android
          "$GODOT" --headless --path . --export-debug Android /tmp/ashen-android/Ashen-Reaches-debug.apk
          test -s /tmp/ashen-android/Ashen-Reaches-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify /tmp/ashen-android/Ashen-Reaches-debug.apk || "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)" verify /tmp/ashen-android/Ashen-Reaches-debug.apk
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Ashen-Reaches-Android-debug-APK
          path: /tmp/ashen-android/Ashen-Reaches-debug.apk
          if-no-files-found: error
          retention-days: 30
